<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="cyber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="mesh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg-grad)" />
  <circle cx="200" cy="200" r="180" fill="url(#mesh)" />

  <!-- Geometric Tech Grid Accents -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,6" opacity="0.5" />

  <!-- Stylized Modern Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="58" fill="#e2e8f0" />
  <!-- Shoulders / Torso -->
  <path d="M 100,320 C 100,245 145,230 200,230 C 255,230 300,245 300,320 Z" fill="#cbd5e1" />
  
  <!-- Sleek Tech Glasses / Visor -->
  <rect x="165" y="145" width="70" height="16" rx="8" fill="url(#cyber-glow)" />
  
  <!-- Neural / AI Nodes Overlay -->
  <circle cx="200" cy="80" r="4" fill="#06b6d4" />
  <circle cx="290" cy="140" r="4" fill="#6366f1" />
  <circle cx="110" cy="140" r="4" fill="#10b981" />
  <line x1="200" y1="84" x2="200" y2="97" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.7" />
  <line x1="286" y1="142" x2="258" y2="155" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.7" />
  <line x1="114" y1="142" x2="142" y2="155" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.7" />

  <!-- Initials Badge at bottom -->
  <rect x="160" y="325" width="80" height="30" rx="15" fill="#1e1b4b" stroke="url(#cyber-glow)" stroke-width="2" />
  <text x="200" y="345" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">ML</text>
</svg>
